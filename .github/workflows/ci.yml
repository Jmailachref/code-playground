name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codeplay
          POSTGRES_PASSWORD: codeplay
          POSTGRES_DB: codeplay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeplay"
          --health-interval 2s
          --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build sandbox images
        run: sh languages/build.sh
      - name: Check migrations apply
        env:
          DATABASE_URL: postgresql+psycopg://codeplay:codeplay@localhost:5432/codeplay_test
        run: alembic upgrade head && alembic downgrade base
      - name: Run tests
        run: python -m pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
