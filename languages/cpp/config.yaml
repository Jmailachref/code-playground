display_name: "C++20 (GCC 14)"
image: "codeplay/cpp:14"
source_file: "main.cpp"
compile: ["g++", "-O2", "-std=c++20", "-o", "main", "main.cpp"]
run: ["./main"]
time_multiplier: 1
extra_memory_mb: 0
template: |
  #include <iostream>
  #include <string>

  int main() {
      std::string name;
      std::getline(std::cin, name);
      std::cout << "Hello, " << name << "!" << std::endl;
  }
